services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deadline-scheduler-backend
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=sqlite:////app/data/deadline_scheduler.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend:/app
      - db_data:/app/data
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deadline-scheduler-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=sqlite:////app/data/deadline_scheduler.db
    volumes:
      - ./backend:/app
      - db_data:/app/data
    command: python bot.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deadline-scheduler-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
